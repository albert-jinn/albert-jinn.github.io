<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#eef2e6">
<title>조각조각 · 앱에서 만나요</title>
<link rel="icon" href="../icon.png">
<link rel="apple-touch-icon" href="../icon.png">
<style>
  :root { --bg: #eef2e6; --surface: #fff; --ink: #313d36; --muted: #74816e; --line: #d3dccb; --accent: #f2a93b; --accent-ink: #2e2412; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--ink);
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; text-align: center;
  }
  .card { width: 100%; max-width: 360px; padding: 32px 24px 26px; border-radius: 28px; background: var(--surface); box-shadow: 0 2px 0 var(--line), 0 12px 32px rgba(49, 61, 54, .1); }
  img { width: 84px; height: 84px; border-radius: 20px; }
  h1 { margin: 16px 0 8px; font-size: 24px; letter-spacing: -.01em; }
  p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.6; }
  a.btn {
    display: block; margin-top: 22px; padding: 15px 18px; border-radius: 16px; background: var(--accent); color: var(--accent-ink);
    font-weight: 700; font-size: 16px; text-decoration: none; box-shadow: 0 3px 0 rgba(0, 0, 0, .16);
  }
  small { display: block; margin-top: 14px; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
  <main class="card">
    <img src="../icon.png" alt="">
    <h1>조각조각은 이제 앱에서 만나요</h1>
    <p>웹 베타는 종료됐어요.<br>함께 해 주셔서 고마워요!</p>
    <a class="btn" href="https://apps.apple.com/kr/app/id6820933439">App Store에서 받기</a>
    <small>App Store에서 '조각조각'을 검색해도 찾을 수 있어요</small>
  </main>
</body>
</html>
